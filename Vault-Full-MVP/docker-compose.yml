services:
  vault-node-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault-node-1
    environment:
      VAULT_ADDR: 0.0.0.0:8080
      VAULT_NODE_ID: node-1
      VAULT_NODE_ADDRESS: http://vault-node-1:8080
      VAULT_DATA_DIR: /var/lib/vault
      VAULT_CLUSTER_NODES: node-1=http://vault-node-1:8080,node-2=http://vault-node-2:8080,node-3=http://vault-node-3:8080
      VAULT_ENABLE_FAULT_INJECTION: "true"
      VAULT_INTERNAL_TOKEN: "change-me-in-production"
      VAULT_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      VAULT_INTEGRITY_SCRUB_INTERVAL_MS: "60000"
      VAULT_REPAIR_INTERVAL_MS: "2000"
      VAULT_REBALANCE_INTERVAL_MS: "10000"
    ports:
      - "8080:8080"
    volumes:
      - vault-node-1:/var/lib/vault
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 20

  vault-node-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault-node-2
    environment:
      VAULT_ADDR: 0.0.0.0:8080
      VAULT_NODE_ID: node-2
      VAULT_NODE_ADDRESS: http://vault-node-2:8080
      VAULT_DATA_DIR: /var/lib/vault
      VAULT_CLUSTER_NODES: node-1=http://vault-node-1:8080,node-2=http://vault-node-2:8080,node-3=http://vault-node-3:8080
      VAULT_ENABLE_FAULT_INJECTION: "true"
      VAULT_INTERNAL_TOKEN: "change-me-in-production"
      VAULT_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      VAULT_INTEGRITY_SCRUB_INTERVAL_MS: "60000"
      VAULT_REPAIR_INTERVAL_MS: "2000"
      VAULT_REBALANCE_INTERVAL_MS: "10000"
    ports:
      - "8082:8080"
    volumes:
      - vault-node-2:/var/lib/vault
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 20

  vault-node-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault-node-3
    environment:
      VAULT_ADDR: 0.0.0.0:8080
      VAULT_NODE_ID: node-3
      VAULT_NODE_ADDRESS: http://vault-node-3:8080
      VAULT_DATA_DIR: /var/lib/vault
      VAULT_CLUSTER_NODES: node-1=http://vault-node-1:8080,node-2=http://vault-node-2:8080,node-3=http://vault-node-3:8080
      VAULT_ENABLE_FAULT_INJECTION: "true"
      VAULT_INTERNAL_TOKEN: "change-me-in-production"
      VAULT_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      VAULT_INTEGRITY_SCRUB_INTERVAL_MS: "60000"
      VAULT_REPAIR_INTERVAL_MS: "2000"
      VAULT_REBALANCE_INTERVAL_MS: "10000"
    ports:
      - "8083:8080"
    volumes:
      - vault-node-3:/var/lib/vault
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 5s
      timeout: 2s
      retries: 20

  vault-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vault-frontend
    ports:
      - "3000:80"
    depends_on:
      - vault-node-1

volumes:
  vault-node-1:
  vault-node-2:
  vault-node-3:
